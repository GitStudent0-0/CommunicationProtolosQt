#НАСТРОЙКИ УРОВНЯ ЛОГИРОВАНИЯ И МЕСТА
log4cplus.rootLogger=DEBUG, ConsoleAppender, FileAppender
log4cplus.additivity=false

#НАСТРОЙКИ ЛОГИРОВАНИЯ В КОНСОЛЬ
log4cplus.appender.ConsoleAppender=log4cplus::ConsoleAppender
log4cplus.appender.ConsoleAppender.layout=log4cplus::PatternLayout
log4cplus.appender.ConsoleAppender.layout.ConversionPattern=%d{%Y-%m-%d %H:%M:%S:%q} [%-5p] [%M] - %m%n

#НАСТРОЙКИ ЛОГИРОВАНИЯ В ФАЙЛ
log4cplus.appender.FileAppender=log4cplus::RollingFileAppender
log4cplus.appender.FileAppender.File=logs/app.log
log4cplus.appender.FileAppender.CreateDirs=true
log4cplus.appender.FileAppender.Append=true
log4cplus.appender.FileAppender.MaxFileSize=1MB
log4cplus.appender.FileAppender.MaxBackupIndex=5
log4cplus.appender.FileAppender.DelayOpen=true
log4cplus.appender.FileAppender.layout=log4cplus::PatternLayout
log4cplus.appender.FileAppender.layout.ConversionPattern=%d{%Y-%m-%d %H:%M:%S:%q}  [%-5p] [%M] - %m%n

